name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Commits marked [ai-test] only run the AI test, not a new APK.
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[ai-test]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Load and check signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          # Only fingerprints are compared here; the secret values are never printed.
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::SIGNING_KEYSTORE_BASE64 secret not set - using a temporary debug key (updates will not install over older APKs)"
            exit 0
          fi
          echo "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null || true
          KS_SHA=$(sha256sum "$RUNNER_TEMP/release.jks" | cut -c1-64)
          PW_CLEAN=$(printf '%s' "$SIGNING_PASSWORD" | tr -d ' \r\n\t')
          PW_SHA=$(printf '%s' "$PW_CLEAN" | sha256sum | cut -c1-64)
          OK=1
          if [ "$KS_SHA" != "c5ef556f9ab68bab3a1b1f25819ca6f0d5fd8abd8febf6e9954731f9d82e341c" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not the Prostuti key (decoded size $(stat -c%s "$RUNNER_TEMP/release.jks") bytes, expected 2636). Re-paste the whole line from SIGNING_KEYSTORE_BASE64.txt."
            OK=0
          fi
          if [ "$PW_SHA" != "da5b631d7af409ba9b02fa2eaf7496405e8c5dc70ab14b6f2d03d9e2caf4c3cf" ]; then
            if [ "$PW_SHA" = "94da741b2ec7ca33c48d848938bda8d5f0efcda277a6ef3ea2e495996f6d458e" ]; then
              echo "::error::SIGNING_PASSWORD is missing the _ and - symbols (length ${#PW_CLEAN}, expected 24). Re-paste it from SIGNING_PASSWORD.txt including the symbols."
            else
              echo "::error::SIGNING_PASSWORD does not match (length ${#PW_CLEAN}, expected 24). Re-paste it from SIGNING_PASSWORD.txt."
            fi
            OK=0
          fi
          if [ "$OK" != "1" ]; then exit 1; fi
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_PASSWORD_CLEAN=$PW_CLEAN" >> "$GITHUB_ENV"
          echo "::add-mask::$PW_CLEAN"
          echo "Signing with the permanent Prostuti key"

      - name: Build APK
        run: |
          export SIGNING_PASSWORD="$SIGNING_PASSWORD_CLEAN"
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            grep -E "^(> |\* What went wrong|e: |error:|Execution failed|Caused by)" build.log | head -20 | while read -r line; do echo "::error::$line"; done
            exit $status
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Prostuti.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Prostuti-APK
          path: Prostuti.apk

      - name: Publish as a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Prostuti build ${{ github.run_number }}
          body: Install Prostuti.apk on your Android phone (allow "Install unknown apps" when asked).
          files: Prostuti.apk
