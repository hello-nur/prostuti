plugins {
    id 'com.android.application'
}

android {
    namespace 'com.prostuti.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.prostuti.app"
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName "1.3"
    }

    sourceSets {
        // The app itself lives in ../web (same files as the browser preview)
        main.assets.srcDirs = ['../web']
    }

    // One permanent key (from GitHub secrets), so every new APK installs as an update over the old one.
    // Without the secrets, it falls back to the debug key so the build still works.
    def ksPath = System.getenv("SIGNING_KEYSTORE_PATH")
    def ksPass = System.getenv("SIGNING_PASSWORD")
    def hasKey = ksPath && ksPass && file(ksPath).exists()
    signingConfigs {
        release {
            if (hasKey) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias "prostuti"
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
