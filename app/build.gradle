plugins {
    id 'com.android.application'
}

android {
    namespace 'com.prostuti.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.prostuti.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    sourceSets {
        // The app itself lives in ../web (same files as the browser preview)
        main.assets.srcDirs = ['../web']
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly on phones.
            // For Google Play, create your own upload key and change this.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
